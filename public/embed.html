<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>MediaVault Embed Relay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    /* Pop-out button */
    #popout {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    #popout:hover {
      background: rgba(0, 194, 186, 0.9);
      border-color: #00C2BA;
    }
    #popout:active {
      transform: translateY(1px);
    }
    .error {
      color: #8B9DB5;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding-top: 40vh;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <button id="popout" style="display: none;">⧉ Pop Out</button>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('v');

      if (!id || !/^[A-Za-z0-9_-]{6,}$/.test(id)) {
        document.getElementById('root').innerHTML =
          '<div class="error">No valid video ID provided.</div>';
        return;
      }

      var src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) +
        '?autoplay=1&mute=1&rel=0&modestbranding=1&playsinline=1&origin=' +
        encodeURIComponent(window.location.origin);

      var iframe = document.createElement('iframe');
      iframe.src = src;
      iframe.setAttribute('allow',
        'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      document.getElementById('root').appendChild(iframe);

      // Show + wire up the Pop Out button (only when we're in a normal page, not already popped out)
      var isPoppedOut = params.get('popout') === '1';
      var btn = document.getElementById('popout');
      if (!isPoppedOut) {
        btn.style.display = 'block';
        btn.addEventListener('click', function () {
          var url = window.location.origin + window.location.pathname +
            '?v=' + encodeURIComponent(id) + '&popout=1';

          // Open a small always-on-top-ish floating window
          var w = window.open(
            url,
            'mediavault-miniplayer',
            'width=480,height=300,menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=no'
          );

          // Focus it
          if (w) w.focus();
        });
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>MediaVault Embed Relay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Floating action bar — top right */
    #actions {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    body:hover #actions,
    #actions.pinned { opacity: 1; }

    /* Buttons */
    .btn {
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }
    .btn:hover {
      background: rgba(0, 194, 186, 0.9);
      border-color: #00C2BA;
    }
    .btn:active {
      transform: translateY(1px);
    }

    /* Popout mode styling */
    body.popout #actions {
      opacity: 1;
    }
    body.popout .btn-close {
      background: rgba(220, 60, 60, 0.85);
      border-color: rgba(220, 60, 60, 0.9);
    }
    body.popout .btn-close:hover {
      background: rgba(240, 70, 70, 1);
    }

    /* Error state */
    .error {
      color: #8B9DB5;
      text-align: center;
      padding-top: 40vh;
      font-size: 14px;
    }

    /* Small padding adjustment when in popout for the top bar */
    body.popout iframe {
      top: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <div id="actions">
    <button class="btn btn-popout" id="popoutBtn" style="display: none;">⧉ Pop Out</button>
    <button class="btn btn-return" id="returnBtn" style="display: none;">↩ Return to App</button>
    <button class="btn btn-close" id="closeBtn" style="display: none;">✕ Close</button>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('v');
      var isPopout = params.get('popout') === '1';
      var autoplay = isPopout ? '1' : (params.get('autoplay') || '1');
      var mute = params.get('mute') || '1';

      if (!id || !/^[A-Za-z0-9_-]{6,}$/.test(id)) {
        document.getElementById('root').innerHTML =
          '<div class="error">No valid video ID provided.</div>';
        return;
      }

      // Build the YouTube embed URL
      var embedParams = new URLSearchParams({
        autoplay: autoplay,
        mute: mute,
        rel: '0',
        modestbranding: '1',
        playsinline: '1',
        origin: window.location.origin,
      });
      var src = 'https://www.youtube-nocookie.com/embed/' +
        encodeURIComponent(id) + '?' + embedParams.toString();

      var iframe = document.createElement('iframe');
      iframe.src = src;
      iframe.setAttribute('allow',
        'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      document.getElementById('root').appendChild(iframe);

      // ── Popout mode ──
      if (isPopout) {
        document.body.classList.add('popout');
        document.getElementById('closeBtn').style.display = 'block';
        document.getElementById('returnBtn').style.display = 'block';

        document.getElementById('closeBtn').addEventListener('click', function () {
          window.close();
        });

        document.getElementById('returnBtn').addEventListener('click', function () {
          // Bring opener window to focus, then close this one
          try {
            if (window.opener && !window.opener.closed) {
              window.opener.focus();
            }
          } catch (e) { /* ignore */ }
          window.close();
        });

        // Auto-size the window to match 16:9 video aspect
        // (only works if the window was opened by us and we have control)
        try {
          var targetW = 480;
          var targetH = Math.round(targetW * (9 / 16)) + 40; // +40 for title bar
          window.resizeTo(targetW, targetH);
        } catch (e) { /* ignore */ }

        return;
      }

      // ── Normal (embedded) mode ──
      var popoutBtn = document.getElementById('popoutBtn');
      popoutBtn.style.display = 'block';

      popoutBtn.addEventListener('click', function () {
        var url = window.location.origin + window.location.pathname +
          '?v=' + encodeURIComponent(id) + '&popout=1';

        var w = window.open(
          url,
          'mediavault-miniplayer',
          'width=480,height=310,menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=no'
        );

        if (w) w.focus();
      });
    })();
  </script>
</body>
</html>
